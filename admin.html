<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityShop - Belanja Lucu & Hemat</title>
<style>
:root{
  --primary:#FF4DA6;
  --secondary:#FF8FD9;
  --bg:#FFE4F1;
  --surface:#FFFFFF;
  --text:#333;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:80px}
img{width:100%;border-radius:18px}
button{cursor:pointer;border:none;border-radius:18px;padding:12px 16px;font-weight:600}
.hidden{display:none!important}

.header{position:sticky;top:0;background:var(--primary);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.header h1{font-size:18px}
.search{padding:12px 16px;background:var(--surface);margin:12px;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.search input{width:100%;padding:10px;border:1px solid #eee;border-radius:12px}

.tabs{display:flex;gap:8px;padding:0 12px 12px;overflow-x:auto}
.tab{padding:8px 14px;background:var(--surface);border-radius:18px;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.tab.active{background:var(--primary);color:#fff}

.banner{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:20px;margin:12px;border-radius:18px;text-align:center;font-weight:700;box-shadow:0 4px 12px rgba(255,77,166,.3)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:var(--surface);border-radius:18px;padding:10px;box-shadow:0 3px 10px rgba(0,0,0,.08);position:relative}
.badge{position:absolute;top:8px;left:8px;background:var(--primary);color:#fff;font-size:11px;padding:3px 8px;border-radius:12px}
.card h3{font-size:14px;margin:8px 0}
.price{font-weight:700;color:var(--primary)}
.old{font-size:12px;text-decoration:line-through;color:#999;margin-left:4px}
.rating{font-size:12px;color:#f59e0b}
.btn-mini{width:100%;margin-top:8px;background:var(--primary);color:#fff;font-size:12px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:flex;justify-content:space-around;padding:8px 0;box-shadow:0 -2px
